<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102747"/>
      <stop offset="60%" stop-color="#174E87"/>
      <stop offset="100%" stop-color="#1E5C99"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#E2DFD7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg1)"/>
  <circle cx="980" cy="140" r="220" fill="#C7A45B" fill-opacity="0.12"/>
  <!-- Architectural Perspective Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>
  <!-- SEACET Engineering Block -->
  <rect x="110" y="220" width="980" height="310" fill="url(#stone)" stroke="#102747" stroke-width="2"/>
  <rect x="110" y="204" width="980" height="16" fill="#A92F38"/>
  <!-- Central Pediment -->
  <rect x="420" y="160" width="360" height="370" fill="#FFFFFF" stroke="#102747" stroke-width="2"/>
  <polygon points="400,160 600,95 800,160" fill="#102747" stroke="#C7A45B" stroke-width="2.5"/>
  <rect x="420" y="160" width="360" height="16" fill="#A92F38"/>
  <text x="600" y="200" text-anchor="middle" fill="#102747" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="14" letter-spacing="2.5">SEACET • K.R. PURAM CAMPUS</text>
  <!-- Windows & Colonade -->
  <g fill="#174E87" fill-opacity="0.88">
    <rect x="150" y="260" width="70" height="55" rx="2"/>
    <rect x="240" y="260" width="70" height="55" rx="2"/>
    <rect x="330" y="260" width="60" height="55" rx="2"/>
    <rect x="150" y="340" width="70" height="55" rx="2"/>
    <rect x="240" y="340" width="70" height="55" rx="2"/>
    <rect x="330" y="340" width="60" height="55" rx="2"/>
    <rect x="150" y="420" width="70" height="55" rx="2"/>
    <rect x="240" y="420" width="70" height="55" rx="2"/>
    <rect x="330" y="420" width="60" height="55" rx="2"/>
    <rect x="810" y="260" width="60" height="55" rx="2"/>
    <rect x="890" y="260" width="70" height="55" rx="2"/>
    <rect x="980" y="260" width="70" height="55" rx="2"/>
    <rect x="810" y="340" width="60" height="55" rx="2"/>
    <rect x="890" y="340" width="70" height="55" rx="2"/>
    <rect x="980" y="340" width="70" height="55" rx="2"/>
    <rect x="810" y="420" width="60" height="55" rx="2"/>
    <rect x="890" y="420" width="70" height="55" rx="2"/>
    <rect x="980" y="420" width="70" height="55" rx="2"/>
  </g>
  <rect x="470" y="225" width="260" height="190" rx="3" fill="#102747" stroke="#C7A45B" stroke-width="2"/>
  <line x1="556" y1="225" x2="556" y2="415" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <line x1="643" y1="225" x2="643" y2="415" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <line x1="470" y1="290" x2="730" y2="290" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <line x1="470" y1="355" x2="730" y2="355" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <!-- Portico Entrance -->
  <rect x="530" y="445" width="140" height="85" fill="#0B1D36"/>
  <!-- Foreground Green Campus Lawn -->
  <rect x="0" y="530" width="1200" height="145" fill="#163A2E"/>
  <polygon points="500,530 700,530 880,675 320,675" fill="#2B3748"/>
  <circle cx="95" cy="510" r="45" fill="#1F513F"/>
  <circle cx="150" cy="520" r="35" fill="#27634E"/>
  <circle cx="1050" cy="520" r="35" fill="#27634E"/>
  <circle cx="1105" cy="510" r="45" fill="#1F513F"/>
</svg>
